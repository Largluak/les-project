<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Produtos - Sistema de Vendas</title>
    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1><i class="fas fa-box"></i> Produtos</h1>
          <nav class="nav">
            <a href="index.html" class="nav-link"
              ><i class="fas fa-home"></i> Início</a
            >
            <a href="produtos.html" class="nav-link active"
              ><i class="fas fa-box"></i> Produtos</a
            >
            <a href="carrinho.html" class="nav-link"
              ><i class="fas fa-shopping-cart"></i> Carrinho</a
            >
            <a href="pedidos.html" class="nav-link"
              ><i class="fas fa-list"></i> Pedidos</a
            >
          </nav>
        </div>
      </header>

      <main class="main-content">
        <div class="products-container">
          <!-- Filtros e busca -->
          <div class="products-header">
            <div class="search-section">
              <div class="search-box">
                <input
                  type="text"
                  id="product-search"
                  placeholder="Buscar produtos..."
                />
                <button id="search-btn" class="btn btn-outline">
                  <i class="fas fa-search"></i>
                </button>
              </div>
            </div>

            <div class="filters-section">
              <div class="filter-group">
                <label>Preço:</label>
                <input type="number" id="min-price" placeholder="Mín." />
                <input type="number" id="max-price" placeholder="Máx." />
              </div>
              <div class="filter-group">
                <label>Disponibilidade:</label>
                <select id="stock-filter">
                  <option value="">Todos</option>
                  <option value="true">Em estoque</option>
                  <option value="false">Sem estoque</option>
                </select>
              </div>
              <div class="filter-group">
                <button id="apply-filters" class="btn btn-primary">
                  <i class="fas fa-filter"></i> Filtrar
                </button>
                <button id="clear-filters" class="btn btn-secondary">
                  <i class="fas fa-times"></i> Limpar
                </button>
              </div>
            </div>
          </div>

          <!-- Lista de produtos -->
          <div class="products-grid" id="products-grid">
            <!-- Produtos serão carregados dinamicamente -->
          </div>

          <!-- Paginação -->
          <div class="pagination" id="pagination">
            <!-- Paginação será carregada dinamicamente -->
          </div>
        </div>
      </main>
    </div>

    <!-- Modal de detalhes do produto -->
    <div id="product-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modal-product-name">Detalhes do Produto</h3>
          <button id="close-product-modal" class="btn btn-sm btn-outline">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body" id="product-details">
          <!-- Detalhes serão carregados dinamicamente -->
        </div>
        <div class="modal-footer">
          <button id="close-modal-btn" class="btn btn-secondary">Fechar</button>
          <button id="add-to-cart-btn" class="btn btn-primary">
            <i class="fas fa-cart-plus"></i> Adicionar ao Carrinho
          </button>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/image-config.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
